<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Propio - Next-generation Property Management SaaS">
  <title th:text="${pageTitle != null ? pageTitle + ' | Propio' : 'Propio - Property Management'}">Propio - Property Management</title>

  <!-- Preconnect Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Spring Security CSRF Meta Tags for AJAX/JS Requests -->
  <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}"/>
  <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>

  <!-- Propio Custom Theme & Design System -->
  <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
  <div class="app-wrapper">
    <!-- Backdrop for Mobile Sidebar -->
    <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

    <!-- Modular Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- Main Content Container -->
    <div class="app-main">
      <!-- Modular Topbar Fragment -->
      <div th:replace="~{fragments/topbar :: topbar}"></div>

      <!-- Main Body View Area -->
      <main class="content-body" role="main">
        <div th:replace="${content}"></div>
      </main>
    </div>
  </div>

  <!-- Toast Notification Container (Fixed Top-Right) -->
  <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1095;">
    <!-- Success Toast -->
    <div th:if="${successMessage != null}" 
         class="toast align-items-center text-white border-0 show animate-toast mb-2 shadow-lg" 
         style="background: linear-gradient(135deg, #10B981 0%, #059669 100%);"
         role="alert" aria-live="assertive" aria-atomic="true" id="appSuccessToast">
      <div class="d-flex p-2 align-items-center">
        <i class="bi bi-check-circle-fill fs-5 me-2 ms-2 text-white"></i>
        <div class="toast-body text-white fw-semibold fs-8" th:text="${successMessage}">
          Action succeeded!
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>

    <!-- Error Toast -->
    <div th:if="${errorMessage != null}" 
         class="toast align-items-center text-white border-0 show animate-toast mb-2 shadow-lg" 
         style="background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);"
         role="alert" aria-live="assertive" aria-atomic="true" id="appErrorToast">
      <div class="d-flex p-2 align-items-center">
        <i class="bi bi-exclamation-octagon-fill fs-5 me-2 ms-2 text-white"></i>
        <div class="toast-body text-white fw-semibold fs-8" th:text="${errorMessage}">
          An error occurred.
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <!-- Chart.js & Bootstrap 5 JavaScript Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>

  <!-- Propio Core Theme & Interaction Script -->
  <script th:src="@{/js/theme.js}"></script>
</body>
</html>
