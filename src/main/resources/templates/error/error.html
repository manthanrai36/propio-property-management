<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${(status != null ? status + ' - Error' : 'Error') + ' | Propio'}">Error | Propio</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Propio Custom Theme -->
  <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3" style="background-color: var(--bg-app);">

  <div class="card-propio p-4 p-md-5 text-center shadow-lg fade-in-up" style="max-width: 520px; width: 100%;">
    <!-- Brand Logo -->
    <div class="d-flex justify-content-center mb-4">
      <div class="brand-container">
        <div class="brand-logo-icon">
          <i class="bi bi-layers-half"></i>
        </div>
        <span class="brand-text">Propio</span>
      </div>
    </div>

    <!-- Generic Error Illustration Icon -->
    <div class="mb-4">
      <div class="d-inline-flex align-items-center justify-content-center rounded-circle" 
           style="width: 90px; height: 90px; background-color: var(--propio-primary-light); color: var(--propio-primary);">
        <i class="bi bi-info-circle-fill fs-1"></i>
      </div>
    </div>

    <!-- Error Badge & Heading -->
    <span class="badge bg-secondary-subtle text-secondary rounded-pill px-3 py-1 fs-8 fw-bold mb-3"
          th:text="${'Error ' + (status != null ? status : 'Notice')}">Error</span>
    <h3 class="fw-bold font-heading mb-2" style="color: var(--text-heading);">Something Went Wrong</h3>
    <p class="text-muted fs-8 mb-4">
      <span th:if="${errorMessage != null}" th:text="${errorMessage}">An unexpected error occurred while processing your request.</span>
      <span th:unless="${errorMessage != null}">The requested action could not be completed.</span>
    </p>

    <!-- Navigation Options -->
    <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
      <a th:href="@{/dashboard}" class="btn-propio-primary py-2 px-4 fs-8 text-decoration-none ripple">
        <i class="bi bi-grid-fill me-1"></i> Return to Dashboard
      </a>
      <a th:href="@{/properties}" class="btn btn-outline-secondary py-2 px-3 fs-8 text-decoration-none ripple">
        <i class="bi bi-building me-1"></i> View Properties
      </a>
    </div>

    <!-- Theme Toggle & Footer -->
    <div class="mt-4 pt-3 border-top d-flex align-items-center justify-content-between text-muted fs-9" style="border-color: var(--border-light) !important;">
      <span>Propio Property Management System</span>
      <button id="theme-toggle-btn" class="btn-icon-subtle" style="width: 28px; height: 28px;" title="Toggle theme">
        <i id="theme-toggle-icon" class="bi bi-sun-fill text-warning"></i>
      </button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/theme.js}"></script>
</body>
</html>
