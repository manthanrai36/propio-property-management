<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign In - Propio Property Management">
  <title>Sign In | Propio</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Propio Custom Theme -->
  <link rel="stylesheet" th:href="@{/css/theme.css}">
  <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">

  <style>
    .auth-canvas {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 20%, rgba(108, 76, 241, 0.08) 0%, transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
                  var(--bg-app);
      padding: 24px;
      position: relative;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-xl);
      padding: 40px 36px;
      box-shadow: var(--shadow-elevated);
    }
    .theme-corner-toggle {
      position: absolute;
      top: 24px;
      right: 24px;
    }
    .demo-credential-pill {
      background: var(--bg-card-subtle);
      border: 1px dashed var(--border-light);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .demo-credential-pill:hover {
      background: var(--bg-hover);
      border-color: var(--propio-primary);
    }
  </style>
</head>
<body>
  <div class="auth-canvas">
    <!-- Top-right theme switcher -->
    <div class="theme-corner-toggle">
      <button id="theme-toggle-btn" class="btn-icon-topbar ripple" type="button" aria-label="Toggle theme mode">
        <i id="theme-toggle-icon" class="bi bi-moon-stars-fill text-muted"></i>
      </button>
    </div>

    <div class="auth-card fade-in-up">
      <!-- Brand Logo -->
      <div class="d-flex align-items-center gap-2 mb-4">
        <div class="brand-logo-icon">
          <i class="bi bi-layers-half"></i>
        </div>
        <span class="brand-text">Propio</span>
      </div>

      <h2 class="fs-4 fw-bold mb-1">Welcome back</h2>
      <p class="text-muted fs-8 mb-4">Sign in to access your property dashboard</p>

      <!-- Feedback Alerts -->
      <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center gap-2 py-2 fs-8 rounded-3 mb-3" role="alert">
        <i class="bi bi-exclamation-triangle-fill fs-6"></i>
        <span th:text="${errorMessage}">Invalid credentials</span>
      </div>

      <div th:if="${successMessage}" class="alert alert-success d-flex align-items-center gap-2 py-2 fs-8 rounded-3 mb-3" role="alert">
        <i class="bi bi-check-circle-fill fs-6"></i>
        <span th:text="${successMessage}">Action succeeded</span>
      </div>

      <!-- Login Form -->
      <form th:action="@{/login}" method="post">
        <!-- CSRF Token injected by Thymeleaf -->
        <div class="mb-3">
          <label for="email" class="form-label fs-8 fw-semibold text-muted">Email address</label>
          <div class="position-relative">
            <input type="email" 
                   id="email" 
                   name="email" 
                   class="form-control" 
                   style="height: 46px; border-radius: var(--radius-sm); padding-left: 40px; background-color: var(--bg-input); border-color: var(--border-light); color: var(--text-main);" 
                   placeholder="name@example.com" 
                   required 
                   autofocus>
            <i class="bi bi-envelope text-muted position-absolute top-50 start-0 translate-middle-y ms-3"></i>
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="password" class="form-label fs-8 fw-semibold text-muted mb-0">Password</label>
            <a href="#forgot" class="text-decoration-none fs-9 fw-semibold text-primary">Forgot password?</a>
          </div>
          <div class="position-relative">
            <input type="password" 
                   id="password" 
                   name="password" 
                   class="form-control" 
                   style="height: 46px; border-radius: var(--radius-sm); padding-left: 40px; padding-right: 42px; background-color: var(--bg-input); border-color: var(--border-light); color: var(--text-main);" 
                   placeholder="••••••••" 
                   required>
            <i class="bi bi-lock text-muted position-absolute top-50 start-0 translate-middle-y ms-3"></i>
            <button type="button" id="togglePasswordBtn" class="btn btn-link text-muted position-absolute top-50 end-0 translate-middle-y me-2 p-0 text-decoration-none" aria-label="Show password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" name="remember-me" id="rememberMe" checked>
          <label class="form-check-label fs-8 text-muted" for="rememberMe">
            Keep me signed in for 14 days
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-propio-primary w-100 py-2 justify-content-center fs-7 mb-4">
          <span>Sign In</span>
          <i class="bi bi-arrow-right"></i>
        </button>
      </form>

      <!-- Quick Demo Account Fillers -->
      <div class="mb-4" th:if="${demoCredentialsEnabled}">
        <div class="text-muted fs-9 fw-bold text-uppercase mb-2 text-center">Quick Demo Credentials</div>
        <div class="d-flex flex-column gap-2">
          <div class="demo-credential-pill" onclick="fillCredentials('admin@propio.com', 'admin123')">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <strong class="text-primary">Admin (Manager):</strong> admin@propio.com
              </div>
              <span class="badge bg-primary-subtle text-primary fs-9">Fill</span>
            </div>
          </div>
          <div class="demo-credential-pill" onclick="fillCredentials('tenant@propio.com', 'tenant123')">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <strong class="text-success">Tenant:</strong> tenant@propio.com
              </div>
              <span class="badge bg-success-subtle text-success fs-9">Fill</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer Link to Register -->
      <div class="text-center fs-8 text-muted">
        Don't have an account? 
        <a th:href="@{/register}" class="text-primary fw-semibold text-decoration-none">Create tenant account</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script th:src="@{/js/theme.js}"></script>
  <script>
    // Password visibility toggle
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    if (toggleBtn && passwordInput) {
      toggleBtn.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        toggleBtn.querySelector('i').className = type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
      });
    }

    // Quick fill helper
    function fillCredentials(email, pwd) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pwd;
    }
  </script>
</body>
</html>
