<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head></head>
<body>
<!-- Propio Topbar Fragment with Dynamic Authenticated User Details -->
<header th:fragment="topbar" class="app-topbar">
  <div class="d-flex align-items-center gap-3">
    <!-- Mobile Hamburger Toggle -->
    <button id="sidebar-toggle-btn" class="btn btn-icon-topbar d-lg-none" type="button" aria-label="Toggle navigation menu">
      <i class="bi bi-list fs-4"></i>
    </button>

    <!-- Global Search Input with Keyboard Shortcut Pill & Live Dropdown -->
    <div class="topbar-search position-relative">
      <form th:action="@{/search}" method="get" class="d-flex align-items-center m-0 p-0 w-100" id="topbar-search-form">
        <i class="bi bi-search search-icon" aria-hidden="true"></i>
        <input id="topbar-search-input" 
               name="q"
               type="text" 
               autocomplete="off"
               placeholder="Search properties, tenants, leases, payments..." 
               aria-label="Global Search">
        <span id="search-kbd-hint" class="kbd-hint" role="button" tabindex="0" title="Click or press shortcut to search">Ctrl + /</span>
      </form>
      <!-- Live Search Suggestions Container -->
      <div id="search-suggestions" class="dropdown-menu shadow-card border-0 rounded-4 p-2 mt-1 position-absolute w-100" style="display: none; max-height: 380px; overflow-y: auto; z-index: 1060;">
        <div id="search-suggestions-content"></div>
      </div>
    </div>
  </div>

  <!-- Right Actions: Theme Toggle, Notifications, User Profile -->
  <div class="topbar-actions">
    <!-- Role Badge Indicator -->
    <div class="d-none d-md-flex align-items-center">
      <span sec:authorize="hasRole('ADMIN')" class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 rounded-pill fs-9 fw-bold">
        <i class="bi bi-shield-check me-1"></i> Admin Portal
      </span>
      <span sec:authorize="hasRole('TENANT')" class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2 rounded-pill fs-9 fw-bold">
        <i class="bi bi-person-check me-1"></i> Tenant Portal
      </span>
    </div>

    <!-- Light / Dark Theme Switcher Button -->
    <button id="theme-toggle-btn" 
            class="btn-icon-topbar ripple" 
            type="button" 
            aria-label="Toggle theme mode"
            title="Toggle theme (Light / Dark)">
      <i id="theme-toggle-icon" class="bi bi-moon-stars-fill text-muted"></i>
    </button>

    <!-- Support Center Link -->
    <a th:href="@{/support}" class="btn-icon-topbar ripple text-decoration-none" aria-label="Help & Support" title="Help & Support">
      <i class="bi bi-question-circle"></i>
    </a>

    <!-- Notification Bell with Real Dropdown & Live Unread Count -->
    <div class="dropdown" id="notification-bell-dropdown">
      <button class="btn-icon-topbar ripple dropdown-toggle no-arrow position-relative" 
              type="button" 
              id="notificationDropdownBtn" 
              data-bs-toggle="dropdown" 
              aria-expanded="false" 
              aria-label="Notifications" 
              title="Notifications">
        <i class="bi bi-bell"></i>
        <span id="notification-badge" class="badge-dot" style="display: none;">0</span>
      </button>
      <div class="dropdown-menu dropdown-menu-end shadow-card border-0 rounded-4 mt-2 p-0" 
           aria-labelledby="notificationDropdownBtn" 
           style="width: 360px; max-width: 90vw;">
        <div class="d-flex align-items-center justify-content-between p-3 border-bottom">
          <div class="d-flex align-items-center gap-2">
            <h6 class="m-0 fw-bold fs-7">Notifications</h6>
            <span id="notification-header-count" class="badge bg-primary-subtle text-primary rounded-pill fs-9">0</span>
          </div>
          <button id="mark-all-read-btn" class="btn btn-sm btn-link text-decoration-none text-primary p-0 fs-9 fw-semibold" type="button">
            Mark all read
          </button>
        </div>
        <div id="notification-items-container" style="max-height: 320px; overflow-y: auto;">
          <div class="p-4 text-center text-muted fs-8" id="notification-empty-state">
            <i class="bi bi-bell-slash fs-4 d-block mb-1 text-muted"></i>
            No unread notifications
          </div>
        </div>
        <div class="p-2 border-top text-center bg-light-subtle rounded-bottom-4">
          <small class="text-muted fs-9">Real-time alerts & service updates</small>
        </div>
      </div>
    </div>

    <!-- Authenticated User Profile Dropdown -->
    <div class="dropdown" sec:authorize="isAuthenticated()">
      <button class="user-profile-btn ripple dropdown-toggle" 
              type="button" 
              id="userProfileDropdown" 
              data-bs-toggle="dropdown" 
              aria-expanded="false" 
              aria-label="User profile menu">
        <img th:if="${#authentication?.principal?.avatarUrl != null and !#authentication.principal.avatarUrl.isBlank()}"
             th:src="${#authentication.principal.avatarUrl}" 
             th:alt="${#authentication?.principal?.fullName != null ? #authentication.principal.fullName : 'User'}" 
             class="user-avatar">
        <div th:unless="${#authentication?.principal?.avatarUrl != null and !#authentication.principal.avatarUrl.isBlank()}"
             class="user-avatar rounded-circle d-flex align-items-center justify-content-center text-white fw-bold fs-8 flex-shrink-0"
             th:style="'background: ' + ${#authentication?.principal?.avatarColor != null ? #authentication.principal.avatarColor : 'linear-gradient(135deg, #6C4CF1, #5131E5)'} + '; width: 38px; height: 38px;'"
             th:text="${#authentication?.principal?.initials != null ? #authentication.principal.initials : 'U'}">U</div>
        <div class="user-info">
          <span class="user-name" th:text="${#authentication?.principal?.fullName != null ? #authentication.principal.fullName : 'User'}">User Name</span>
          <span class="user-role" th:text="${#authentication?.principal?.displayRole != null ? #authentication.principal.displayRole : 'Member'}">Role</span>
        </div>
        <i class="bi bi-chevron-down text-muted fs-8 ms-1"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow-card border-0 rounded-4 mt-2" aria-labelledby="userProfileDropdown">
        <li>
          <div class="px-3 py-2 border-bottom border-light">
            <div class="fw-bold fs-8" th:text="${#authentication?.principal?.fullName != null ? #authentication.principal.fullName : 'User'}">User Name</div>
            <div class="text-muted fs-9" th:text="${#authentication?.principal?.username != null ? #authentication.principal.username : ''}">email@example.com</div>
          </div>
        </li>
        <li><h6 class="dropdown-header text-uppercase fs-9 text-muted fw-bold mt-1">Account</h6></li>
        <li><a sec:authorize="hasRole('TENANT')" class="dropdown-item py-2 fs-8" th:href="@{'/tenants/' + ${#authentication.principal.tenantId}}"><i class="bi bi-person me-2"></i>My Profile</a></li>
        <li><a sec:authorize="hasRole('ADMIN')" class="dropdown-item py-2 fs-8" th:href="@{/tenants}"><i class="bi bi-people me-2"></i>Tenants Directory</a></li>
        <li><a class="dropdown-item py-2 fs-8" th:href="@{/settings}"><i class="bi bi-gear me-2"></i>Settings & Preferences</a></li>
        <li><a class="dropdown-item py-2 fs-8" th:href="@{/support}"><i class="bi bi-question-circle me-2"></i>Help & Support</a></li>
        <li><hr class="dropdown-divider"></li>
        <li>
          <!-- CSRF-protected Spring Security Logout Form -->
          <form th:action="@{/logout}" method="post" class="m-0 p-0">
            <button type="submit" class="dropdown-item py-2 text-danger fs-8 d-flex align-items-center w-100 border-0 bg-transparent">
              <i class="bi bi-box-arrow-right me-2"></i>Sign Out
            </button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</header>
</body>
</html>
