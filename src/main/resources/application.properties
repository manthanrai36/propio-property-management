# ==============================================================================
# Propio Main Configuration (Base Defaults)
# ==============================================================================
spring.application.name=propio

# Server Configuration & Reverse Proxy
server.port=${PORT:8080}
server.servlet.context-path=
server.forward-headers-strategy=native

# Production-grade Error Handling: Never expose internal stack traces or whitelabel
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# Session Cookie Security
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=2h

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
propio.upload.dir=${PROPIO_UPLOAD_DIR:uploads}

# JPA / Hibernate Open Session In View (OSIV)
spring.jpa.open-in-view=false

# Propio Feature Flags & Seeder Defaults
propio.demo-credentials.enabled=false
propio.seed.enabled=false

# Propio Rent Engine & Billing Scheduler
propio.billing.scheduler.enabled=true
propio.billing.scheduler.cron=0 0 1 1 * ?
propio.billing.late-fee-percentage=5.0

# Propio Email Notifications & Spring Mail
propio.mail.enabled=${PROPIO_MAIL_ENABLED:false}
propio.mail.from-address=${PROPIO_MAIL_FROM:noreply@propio.com}
propio.mail.from-name=${PROPIO_MAIL_FROM_NAME:Propio Property Management}
propio.mail.retry-max-attempts=3

# SMTP Settings (strictly read from environment variables)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
