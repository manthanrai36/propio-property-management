# ==============================================================================
# Propio Main Configuration
# ==============================================================================
spring.application.name=propio
spring.profiles.active=dev

# Server Configuration
server.port=8080
server.servlet.context-path=

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
propio.upload.dir=uploads

# JPA / Hibernate Open Session In View (OSIV)
spring.jpa.open-in-view=false

# Propio Rent Engine & Billing Scheduler
propio.billing.scheduler.enabled=true
propio.billing.scheduler.cron=0 0 1 1 * ?
propio.billing.late-fee-percentage=5.0

# Propio Email Notifications & Spring Mail
propio.mail.enabled=${PROPIO_MAIL_ENABLED:false}
propio.mail.from-address=${PROPIO_MAIL_FROM:noreply@propio.com}
propio.mail.from-name=${PROPIO_MAIL_FROM_NAME:Propio Property Management}
propio.mail.retry-max-attempts=3

# SMTP Settings (strictly read from environment variables)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
