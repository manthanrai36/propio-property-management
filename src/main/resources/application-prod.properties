# ==============================================================================
# Propio PROD Configuration (Production Hardened for Cloud & Container Platforms)
# All parameters read strictly from Environment Variables with production defaults.
# ==============================================================================
spring.application.name=propio
spring.profiles.active=prod

# Server & Reverse Proxy
server.port=${PORT:8080}
server.forward-headers-strategy=native
server.servlet.context-path=

# Production Error Handling: Zero stack trace disclosure, custom error views
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# HTTPS & Secure Session Cookies
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=2h

# Database Connection (MySQL / Cloud RDS / Railway / Render)
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/propio_db?useSSL=true&serverTimezone=UTC}}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# H2 Web Console (Strictly Disabled in Production)
spring.h2.console.enabled=false

# Production Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:15}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:3}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA & Hibernate Settings (MySQL Dialect, Zero SQL Echo)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# File Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
propio.upload.dir=${PROPIO_UPLOAD_DIR:uploads}

# Propio Security & Bootstrap Configuration
propio.security.remember-me.key=${PROPIO_REMEMBER_ME_KEY:propio-production-signing-key-enterprise}
propio.demo-credentials.enabled=false
propio.seed.enabled=${PROPIO_SEED_ENABLED:false}
propio.admin.email=${PROPIO_ADMIN_EMAIL:}
propio.admin.password=${PROPIO_ADMIN_PASSWORD:}
propio.admin.name=${PROPIO_ADMIN_NAME:System Administrator}

# Propio Rent Engine & Billing Scheduler
propio.billing.scheduler.enabled=${PROPIO_BILLING_ENABLED:true}
propio.billing.scheduler.cron=0 0 1 1 * ?
propio.billing.late-fee-percentage=${PROPIO_LATE_FEE_PCT:5.0}

# Email Notifications (Spring Mail via SMTP Env Vars)
propio.mail.enabled=${PROPIO_MAIL_ENABLED:false}
propio.mail.from-address=${PROPIO_MAIL_FROM:noreply@propio.com}
propio.mail.from-name=${PROPIO_MAIL_FROM_NAME:Propio Property Management}
propio.mail.retry-max-attempts=3

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Enterprise Logging: Clean, Structured, Sensitive Data Redacted
logging.level.root=WARN
logging.level.com.propio=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=OFF
