# ==============================================================================
# Propio PROD Configuration (MySQL 8 with Environment Variable Overrides)
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/propio_db?useSSL=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# H2 Web Console (Disabled in Production)
spring.h2.console.enabled=false

# JPA & Hibernate Settings (MySQL Dialect)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

# Production Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Logging
logging.level.com.propio=INFO
logging.level.org.springframework.web=WARN
