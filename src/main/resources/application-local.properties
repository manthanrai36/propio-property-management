# ==============================================================================
# Propio LOCAL Configuration (Local MySQL 8 Instance)
# ==============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/propio_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# H2 Web Console (Disabled for MySQL profile)
spring.h2.console.enabled=false

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Error Pages
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

# Cookie Settings for Local HTTP
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# Demo Flags for Local Developer Experience
propio.demo-credentials.enabled=true
propio.seed.enabled=true

# Logging
logging.level.com.propio=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# Propio Rent Engine
propio.billing.late-fee-percentage=5.0

# Propio Email Notifications (Local Safe Fallback: false = logs formatted email instead of SMTP)
propio.mail.enabled=false
propio.mail.from-address=noreply@propio.com
propio.mail.from-name=Propio Property Management
